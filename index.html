<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League HQ</title>
<meta name="description" content="Standings, history, trades and writing for our dynasty league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F8; --card:#FFFFFF; --ink:#1A1D23; --muted:#737A85;
  --line:#E4E7EB; --accent:#2E6B8F; --gold:#A0803C; --soft:#EDEFF2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Figtree',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
@media(max-width:640px){.wrap{padding:0 20px}}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.dim{color:var(--muted)}
.empty{color:var(--muted);padding:28px 0}

/* masthead */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;
  height:46px;font-size:14px;color:var(--muted)}
.top .live{color:var(--accent);font-weight:600}
.mast{background:var(--card);border-bottom:1px solid var(--line);padding:44px 0 0}
.brand{font-size:clamp(30px,4.6vw,42px);font-weight:800;letter-spacing:-.028em;
  line-height:1.1;display:inline-block}
.brand:hover{color:var(--accent)}
.mast .sub{font-size:15px;color:var(--muted);margin-top:10px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:34px}
nav a{padding:12px 0 16px;margin-right:32px;font-size:15px;font-weight:500;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
@media(max-width:640px){nav a{margin-right:22px;font-size:14px}}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
main{padding:64px 0 120px;min-height:60vh}

/* type */
.kicker{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:14px}
h1.page{font-size:clamp(32px,4.6vw,44px);font-weight:800;letter-spacing:-.028em;line-height:1.12}
.lede{color:var(--muted);font-size:17px;margin-top:16px;max-width:62ch;line-height:1.6}
h2.sec{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 22px;padding-bottom:16px;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{color:var(--accent);font-size:14px;font-weight:500}

/* home */
.home{display:grid;grid-template-columns:1fr 300px;gap:80px}
@media(max-width:900px){.home{grid-template-columns:1fr;gap:56px}}
.lead{border-bottom:1px solid var(--line);padding-bottom:48px;margin-bottom:16px;display:block}
.lead h3{font-size:clamp(30px,4vw,40px);font-weight:800;letter-spacing:-.028em;
  line-height:1.18;margin-bottom:18px}
.lead:hover h3{color:var(--accent)}
.lead .dek{font-family:'Newsreader',Georgia,serif;font-size:20px;line-height:1.62;
  color:#4A5058;max-width:54ch}
.byline{font-size:14px;color:var(--muted);margin-top:22px}
.stack .row{display:block;padding:34px 0;border-bottom:1px solid var(--line)}
.stack .row h4{font-size:21px;font-weight:700;letter-spacing:-.018em;line-height:1.32}
.stack .row:hover h4{color:var(--accent)}
.stack .row p{font-family:'Newsreader',Georgia,serif;font-size:17px;color:var(--muted);
  margin-top:10px;line-height:1.6;max-width:56ch}
aside .mod{margin-bottom:56px}
.mini{width:100%;border-collapse:collapse;font-size:15px}
.mini td{padding:14px 2px;border-top:1px solid var(--line)}
.mini tr:first-child td{border-top:none}
.mini .p{color:var(--muted);width:34px;font-variant-numeric:tabular-nums}
.mini .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mini a:hover{color:var(--accent)}
.tick{padding:20px 0;border-top:1px solid var(--line)}
.tick:first-child{border-top:none}
.tick .when{font-size:13px;color:var(--muted);margin-bottom:8px}
.tick .swap em{font-style:normal;color:var(--accent);padding:0 8px}

/* tables */
table.data{width:100%;border-collapse:collapse;font-size:16px}
table.data th{text-align:left;font-size:14px;font-weight:500;color:var(--muted);
  padding:0 16px 18px 0;letter-spacing:0}
table.data th:first-child{padding-left:4px}
table.data th.n,table.data td.n{text-align:right;padding-right:4px}
table.data td{padding:20px 16px 20px 0;border-top:1px solid var(--line);vertical-align:middle}
table.data td:first-child{padding-left:4px}
table.data tbody tr:hover{background:var(--card)}
.rk{color:var(--muted);width:40px;font-variant-numeric:tabular-nums}
.team{font-weight:600;letter-spacing:-.012em}
a.team:hover{color:var(--accent)}
.rec{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:72px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.crown{color:var(--gold)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:26px;display:block;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .k{font-size:14px;color:var(--muted)}
.card .v{font-size:21px;font-weight:700;letter-spacing:-.018em;margin-top:10px;line-height:1.3}
.card .s{font-size:15px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}

/* article */
.post{max-width:38rem;margin:0 auto}
.post h1{font-size:clamp(32px,4.6vw,44px);font-weight:800;letter-spacing:-.028em;line-height:1.16}
.post .meta{font-size:15px;color:var(--muted);margin:20px 0 48px;
  padding-bottom:28px;border-bottom:1px solid var(--line)}
.post .body{font-family:'Newsreader',Georgia,serif;font-size:20px;line-height:1.78}
.post .body p{margin-bottom:30px}
.back{font-size:15px;color:var(--muted);display:inline-block;margin-bottom:36px}
.back:hover{color:var(--accent)}

/* roster */
.pos{font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;
  background:var(--soft);color:var(--muted);display:inline-block;min-width:48px;text-align:center}
.pos.QB{background:#F2E4E2;color:#8A4A3E}
.pos.RB{background:#DFEDE4;color:#3D6B4F}
.pos.WR{background:#E1EAF4;color:#3A5C80}
.pos.TE{background:#F3EBD9;color:#7A6330}
.split{display:grid;grid-template-columns:1fr 280px;gap:80px}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:52px}}

.msg{padding:20px 24px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;font-size:16px;margin-bottom:32px}
.msg.err{border-color:#D9A5A5;color:#9E3D3D}
footer{border-top:1px solid var(--line);background:var(--card);
  padding:40px 0 56px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <span id="statebar">Loading</span>
  <span class="live" id="clock"></span>
</div></div>

<div class="mast"><div class="wrap">
  <a href="/" class="brand" data-link id="brand">League HQ</a>
  <div class="sub" id="mastsub">Dynasty since —</div>
  <nav id="nav">
    <a href="/" data-link data-r="home">Home</a>
    <a href="/standings" data-link data-r="standings">Standings</a>
    <a href="/teams" data-link data-r="teams">Teams</a>
    <a href="/history" data-link data-r="history">History</a>
    <a href="/trades" data-link data-r="trades">Trades</a>
    <a href="/picks" data-link data-r="picks">Picks</a>
    <a href="/articles" data-link data-r="articles">Writing</a>
  </nav>
</div></div>

<main class="wrap" id="view"></main>

<footer><div class="wrap" id="foot">Data from the Sleeper API</div></footer>

<script src="articles.js"></script>
<script src="legacy.js"></script>
<script>
/* ==========================================================
   CONFIG — the only line you need to change
   ========================================================== */
const LEAGUE_ID = '1312830186235912192';

/* Show only managers currently in the league.
   Set to false to include everyone who has ever played. */
const CURRENT_MANAGERS_ONLY = true;
/* ========================================================== */

const API = 'https://api.sleeper.app/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function get(u){ const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
const pct = (w,l,t) => (w+l+t) ? (w+t/2)/(w+l+t) : 0;
const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pfOf = s => (s.fpts||0)+((s.fpts_decimal||0)/100);
const paOf = s => (s.fpts_against||0)+((s.fpts_against_decimal||0)/100);

const DB = { seasons:[], now:null, chain:[], trades:[], players:null, state:null };

async function loadLeague(){
  const firstL = await get(`${API}/league/${LEAGUE_ID}`);
  const chain = [firstL];
  let cur = firstL, guard = 0;
  while(cur.previous_league_id && guard++ < 30){
    try{ cur = await get(`${API}/league/${cur.previous_league_id}`); }catch{ break; }
    chain.push(cur);
  }
  chain.reverse();
  DB.chain = chain;

  DB.seasons = await Promise.all(chain.map(async l => {
    const [rosters, users] = await Promise.all([
      get(`${API}/league/${l.league_id}/rosters`),
      get(`${API}/league/${l.league_id}/users`)
    ]);
    const nameOf = {}, teamOf = {};
    users.forEach(u => {
      nameOf[u.user_id] = u.display_name;
      teamOf[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name;
    });
    let bracket = [];
    try{ bracket = await get(`${API}/league/${l.league_id}/winners_bracket`); }catch{}
    return {league:l, rosters, nameOf, teamOf, bracket};
  }));
  DB.now = DB.seasons[DB.seasons.length-1];
  try{ DB.state = await get(`${API}/state/nfl`); }catch{}
}

async function loadTrades(){
  if(DB.trades.length) return DB.trades;
  const out = [];
  for(const s of DB.seasons){
    const own = {};
    s.rosters.forEach(r => own[r.roster_id] = s.teamOf[r.owner_id] || `Roster ${r.roster_id}`);
    const weeks = await Promise.all(
      Array.from({length:18}, (_,i) => i+1).map(wk =>
        get(`${API}/league/${s.league.league_id}/transactions/${wk}`)
          .then(tx => ({wk, tx})).catch(() => ({wk, tx:[]}))));
    weeks.forEach(({wk, tx}) => {
      (tx||[]).filter(t => t.type==='trade' && t.status==='complete').forEach(t => out.push({
        season:s.league.season, wk, when:t.status_updated||0,
        teams:(t.roster_ids||[]).map(r => own[r] || `Roster ${r}`),
        picks:(t.draft_picks||[]).length
      }));
    });
  }
  out.sort((a,b)=>b.when-a.when);
  DB.trades = out;
  return out;
}

/* The player file is large, so it is only requested when a roster is
   actually opened, then reused for the rest of the session. */
async function loadPlayers(){
  if(DB.players) return DB.players;
  DB.players = await get(`${API}/players/nfl`);
  return DB.players;
}

function champOf(s){
  const f = (s.bracket||[]).find(m => m.p === 1);
  if(!f || !f.w) return null;
  const r = s.rosters.find(x => x.roster_id === f.w);
  return r ? {name:s.teamOf[r.owner_id]||'Unknown', owner:r.owner_id, roster:r.roster_id} : null;
}

function standingsOf(s){
  return s.rosters.map(r => {
    const st = r.settings || {};
    return { id:r.roster_id, owner:r.owner_id,
      name:s.teamOf[r.owner_id] || 'Open roster', who:s.nameOf[r.owner_id] || '',
      w:st.wins||0, l:st.losses||0, t:st.ties||0,
      pf:pfOf(st), pa:paOf(st), streak:st.streak||'' };
  }).sort((a,b) => pct(b.w,b.l,b.t)-pct(a.w,a.l,a.t) || b.pf-a.pf);
}

function allTime(){
  const all = {};
  DB.seasons.forEach(s => s.rosters.forEach(r => {
    if(!r.owner_id) return;
    const key = ownerKey(r.owner_id);
    const st = r.settings||{};
    const games = (st.wins||0)+(st.losses||0)+(st.ties||0);
    const a = all[key] || (all[key] =
      {owner:key,name:'',w:0,l:0,t:0,pf:0,pa:0,yrs:0,titles:0});
    a.name = s.teamOf[r.owner_id] || a.name;
    if(!games) return;          // season not played yet — don't count it as a year
    a.w+=st.wins||0; a.l+=st.losses||0; a.t+=st.ties||0;
    a.pf+=pfOf(st); a.pa+=paOf(st); a.yrs++;
  }));

  // Fold in any seasons that predate this Sleeper league, matched on manager name.
  (window.LEGACY||[]).forEach(L => {
    const hit = Object.values(all).find(a =>
      a.name.toLowerCase() === String(L.manager||'').toLowerCase());
    if(!hit) return;
    hit.w += L.wins||0; hit.l += L.losses||0; hit.t += L.ties||0;
    hit.pf += L.points||0; hit.yrs += L.seasons||0; hit.titles += L.titles||0;
  });
  DB.seasons.forEach(s => {
    const c = champOf(s);
    if(c && all[ownerKey(c.owner)]) all[ownerKey(c.owner)].titles++;
  });
  const active = new Set(DB.now.rosters.filter(r => r.owner_id).map(r => ownerKey(r.owner_id)));
  return Object.values(all)
    .filter(a => !CURRENT_MANAGERS_ONLY || active.has(a.owner))
    .sort((a,b)=> pct(b.w,b.l,b.t)-pct(a.w,a.l,a.t) || b.pf-a.pf);
}

/* If a manager left and rejoined, Sleeper gives them a second account ID and
   their history splits. MERGE maps the old ID onto the current one. */
function ownerKey(id){
  const m = window.MERGE || {};
  return m[id] || id;
}

/* Which seasons actually have games played — used so "all-time" is never ambiguous. */
function playedSeasons(){
  return DB.seasons.filter(s => s.rosters.some(r => {
    const st = r.settings||{};
    return (st.wins||0)+(st.losses||0)+(st.ties||0) > 0;
  })).map(s => s.league.season);
}
function playedSpan(){
  const p = playedSeasons();
  const extra = (window.LEGACY||[]).length ? ', plus recorded pre-Sleeper seasons' : '';
  if(!p.length) return 'no completed seasons yet';
  if(p.length === 1) return `the ${p[0]} season only${extra}`;
  return `${p[0]}–${p[p.length-1]}${extra}`;
}

const rosterIdOf = owner => {
  const r = DB.now.rosters.find(x => ownerKey(x.owner_id) === ownerKey(owner));
  return r ? r.roster_id : '';
};

const posts = () => (window.ARTICLES||[]).slice()
  .sort((a,b)=>String(b.date).localeCompare(String(a.date)))
  .map(p => Object.assign({}, p, {slug: slug(p.title)}));
const paras = b => String(b).trim().split(/\n\s*\n/)
  .map(x => `<p>${esc(x.trim().replace(/\s*\n\s*/g,' '))}</p>`).join('');
const teaser = b => String(b).trim().split(/\n\s*\n/)[0].replace(/\s*\n\s*/g,' ').trim();

/* ==========================================================
   VIEWS
   ========================================================== */
const V = {};

V.home = () => {
  const ps = posts(), lead = ps[0], rest = ps.slice(1,5);
  const st = standingsOf(DB.now).slice(0,6);
  const played = st.some(r=>r.w+r.l+r.t>0);
  return `<div class="home">
    <div>
      ${lead ? `<a class="lead" href="/article/${lead.slug}" data-link>
        <div class="kicker">${esc(lead.tag||'Latest')}</div>
        <h3>${esc(lead.title)}</h3>
        <div class="dek">${esc(teaser(lead.body).slice(0,240))}</div>
        <div class="byline">${esc(lead.date)}</div></a>`
        : `<p class="empty">No articles yet. Add one in articles.js.</p>`}
      ${rest.length ? `<h2 class="sec">More writing <a href="/articles" data-link>All →</a></h2>
      <div class="stack">${rest.map(p=>`<a class="row" href="/article/${p.slug}" data-link>
        <h4>${esc(p.title)}</h4><p>${esc(teaser(p.body).slice(0,150))}…</p></a>`).join('')}</div>` : ''}
    </div>
    <aside>
      <div class="mod">
        <h2 class="sec">${DB.now.league.season} standings <a href="/standings" data-link>Full →</a></h2>
        ${played ? `<table class="mini">${st.map((r,i)=>`<tr>
            <td class="p">${i+1}</td>
            <td><a href="/team/${r.id}" data-link>${esc(r.name)}</a></td>
            <td class="r">${r.w}-${r.l}</td></tr>`).join('')}</table>`
          : `<p class="empty">Season hasn't started. Records fill in after Week 1.</p>`}
      </div>
      <div class="mod">
        <h2 class="sec">Latest trades <a href="/trades" data-link>All →</a></h2>
        <div id="home-trades"><p class="empty">Loading…</p></div>
      </div>
    </aside>
  </div>`;
};
V.home.after = async () => {
  const t = (await loadTrades()).slice(0,4);
  const el = document.getElementById('home-trades');
  if(!el) return;
  el.innerHTML = t.length ? t.map(x=>`<div class="tick">
      <div class="when">${x.season} · Week ${x.wk}</div>
      <div class="swap">${x.teams.map(esc).join('<em>⇄</em>')}</div></div>`).join('')
    : `<p class="empty">No trades yet.</p>`;
};

V.standings = () => {
  const rows = standingsOf(DB.now);
  const played = rows.some(r=>r.w+r.l+r.t>0);
  return `<div class="kicker">${DB.now.league.season} season</div>
  <h1 class="page">Standings</h1>
  <p class="lede">${played ? 'Sorted by record, with points scored breaking ties.'
    : `The ${DB.now.league.season} season hasn't kicked off. This table fills itself in once Week 1 is played.`}</p>
  <div style="margin-top:44px"><table class="data">
    <thead><tr><th></th><th>Team</th><th>Record</th>
    <th class="n">PF</th><th class="n">PA</th><th class="n">Streak</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td class="rk">${i+1}</td>
      <td><a class="team" href="/team/${r.id}" data-link>${esc(r.name)}</a>
        ${r.who&&r.who!==r.name?`<div class="dim" style="font-size:15px;margin-top:4px">${esc(r.who)}</div>`:''}</td>
      <td class="rec">${r.w}-${r.l}${r.t?'-'+r.t:''}</td>
      <td class="n mono">${fmt(r.pf)}</td>
      <td class="n mono dim">${fmt(r.pa)}</td>
      <td class="n mono dim">${esc(r.streak)}</td></tr>`).join('')}</tbody></table></div>`;
};

V.teams = () => {
  const at = {}; allTime().forEach(a => at[a.owner] = a);
  return `<div class="kicker">${DB.now.league.season}</div>
  <h1 class="page">Teams</h1>
  <p class="lede">The twelve franchises. Records cover
  ${playedSpan()}. Click any team for its roster and season-by-season results.</p>
  <div class="grid" style="margin-top:44px">${standingsOf(DB.now).map(r=>{
    const a = at[ownerKey(r.owner)];
    return `<a class="card" href="/team/${r.id}" data-link>
      <div class="k">${esc(r.who||'Manager')}</div>
      <div class="v">${esc(r.name)}${a&&a.titles?` <span class="crown">${'★'.repeat(a.titles)}</span>`:''}</div>
      <div class="s">${a && a.yrs ? `${a.w}-${a.l} · ${a.yrs} season${a.yrs>1?'s':''}`
        : 'No completed seasons'}</div></a>`;
  }).join('')}</div>`;
};

V.team = id => {
  const r = DB.now.rosters.find(x => x.roster_id === Number(id));
  if(!r) return `<h1 class="page">Team not found</h1>
    <p class="lede">No roster with that ID.
    <a href="/teams" data-link style="color:var(--pine)">Back to teams</a>.</p>`;
  const name = DB.now.teamOf[r.owner_id] || 'Open roster';
  const who = DB.now.nameOf[r.owner_id] || '';
  const a = allTime().find(x => x.owner === ownerKey(r.owner_id));
  const st = r.settings || {};
  const years = DB.seasons.map(s => {
    const rr = s.rosters.find(x => ownerKey(x.owner_id) === ownerKey(r.owner_id));
    if(!rr) return null;
    const ss = rr.settings||{};
    if(!((ss.wins||0)+(ss.losses||0))) return null;
    const c = champOf(s);
    const rank = standingsOf(s).findIndex(x => ownerKey(x.owner) === ownerKey(r.owner_id)) + 1;
    return {season:s.league.season, w:ss.wins||0, l:ss.losses||0, rank,
      champ: c && ownerKey(c.owner) === ownerKey(r.owner_id)};
  }).filter(Boolean).reverse();

  return `<a class="back" href="/teams" data-link>← All teams</a>
  <div class="kicker">${esc(who)}</div>
  <h1 class="page">${esc(name)}${a&&a.titles?` <span class="crown">${'★'.repeat(a.titles)}</span>`:''}</h1>
  <p class="lede">${a ? `${a.w}-${a.l}${a.t?'-'+a.t:''} all-time across ${a.yrs} season${a.yrs>1?'s':''}, ${fmt(a.pf)} points scored.` : ''}</p>
  <div class="split" style="margin-top:56px">
    <div>
      <h2 class="sec">Roster <span class="dim" style="font-size:14px;font-weight:400">${(r.players||[]).length} players</span></h2>
      <div id="roster"><p class="empty">Loading player names…</p></div>
    </div>
    <aside>
      <h2 class="sec">Franchise record</h2>
      ${years.length ? `<table class="mini">${years.map(y=>`<tr>
        <td class="p">${y.season}</td>
        <td>${y.champ?'<span class="crown">★</span> ':''}${y.rank ? y.rank+(['','st','nd','rd'][y.rank]||'th') : ''}</td>
        <td class="r">${y.w}-${y.l}</td></tr>`).join('')}</table>`
        : `<p class="empty">No completed seasons yet.</p>`}
      <div style="margin-top:44px">
        <h2 class="sec">${DB.now.league.season}</h2>
        <table class="mini">
          <tr><td>Record</td><td class="r">${st.wins||0}-${st.losses||0}</td></tr>
          <tr><td>Points for</td><td class="r">${fmt(pfOf(st))}</td></tr>
          <tr><td>Points against</td><td class="r">${fmt(paOf(st))}</td></tr>
        </table>
      </div>
    </aside>
  </div>`;
};
V.team.after = async id => {
  const el = document.getElementById('roster');
  if(!el) return;
  const r = DB.now.rosters.find(x => x.roster_id === Number(id));
  if(!r) return;
  let P;
  try{ P = await loadPlayers(); }
  catch{ el.innerHTML = `<p class="empty">Could not load the player list.</p>`; return; }
  const starters = new Set(r.starters||[]);
  const order = {QB:1,RB:2,WR:3,TE:4,K:5,DEF:6};
  const list = (r.players||[]).map(pid => {
    const p = P[pid] || {};
    const pos = p.position || (p.fantasy_positions||[])[0] || '—';
    return { pos,
      name: p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid),
      team: p.team || 'FA', age: p.age || '', start: starters.has(pid) };
  }).sort((a,b) => (b.start-a.start) || (order[a.pos]||9)-(order[b.pos]||9) || a.name.localeCompare(b.name));
  if(!list.length){ el.innerHTML = `<p class="empty">No players on this roster yet.</p>`; return; }
  el.innerHTML = `<table class="data">
    <thead><tr><th>Pos</th><th>Player</th><th>NFL</th><th class="n">Age</th></tr></thead>
    <tbody>${list.map(p=>`<tr>
      <td><span class="pos ${esc(p.pos)}">${esc(p.pos)}</span></td>
      <td style="font-weight:${p.start?700:500}">${esc(p.name)}
        ${p.start?'<span class="dim" style="font-size:14px;font-weight:400"> · STARTER</span>':''}</td>
      <td class="dim">${esc(p.team)}</td>
      <td class="n mono dim">${esc(p.age)}</td></tr>`).join('')}</tbody></table>`;
};

V.history = () => {
  const at = allTime();
  const top = Math.max.apply(null, at.map(a=>pct(a.w,a.l,a.t)).concat([.001]));
  const titles = DB.seasons.map(s => ({season:s.league.season, c:champOf(s)})).filter(x=>x.c).reverse();
  return `<div class="kicker">Since ${DB.chain[0].season}</div>
  <h1 class="page">The record book</h1>
  <p class="lede">Covering ${playedSpan()}, for managers currently in the league. Records track
  the Sleeper account, so a name change doesn't split anyone. Seasons played before this Sleeper
  league existed can be entered by hand in <span class="mono">legacy.js</span>.</p>
  <h2 class="sec" style="margin-top:64px">Champions</h2>
  ${titles.length ? `<div class="grid">${titles.map(t=>{
      const rid = rosterIdOf(t.c.owner);
      const inner = `<div class="k">${t.season}</div>
        <div class="v crown">★ ${esc(t.c.name)}</div>
        ${rid ? '' : '<div class="s">No longer in the league</div>'}`;
      return rid ? `<a class="card" href="/team/${rid}" data-link>${inner}</a>`
                 : `<div class="card">${inner}</div>`;
    }).join('')}</div>`
    : `<p class="empty">No completed playoff brackets yet. Champions appear here on their own
       once a season finishes in Sleeper.</p>`}
  <h2 class="sec" style="margin-top:64px">All-time regular season</h2>
  <table class="data"><thead><tr><th></th><th>Manager</th><th>Record</th><th></th>
    <th class="n">Win %</th><th class="n">PF</th><th class="n">Yrs</th></tr></thead>
    <tbody>${at.map((a,i)=>{const p=pct(a.w,a.l,a.t);return `<tr>
      <td class="rk">${i+1}</td>
      <td><a class="team" href="/team/${rosterIdOf(a.owner)}" data-link>${esc(a.name)}</a>${a.titles?` <span class="crown">${'★'.repeat(a.titles)}</span>`:''}</td>
      <td class="rec">${a.w}-${a.l}${a.t?'-'+a.t:''}</td>
      <td><div class="bar"><span style="width:${(p/top*100).toFixed(1)}%"></span></div></td>
      <td class="n mono">${p.toFixed(3).replace(/^0/,'')}</td>
      <td class="n mono">${fmt(a.pf)}</td>
      <td class="n mono dim">${a.yrs}</td></tr>`;}).join('')}</tbody></table>`;
};

V.trades = () => `
  <h1 class="page">Trade log</h1>
  <p class="lede">Every trade the league has made, most recent first.</p>
  <div id="tradelist" style="margin-top:44px"><p class="empty">Loading…</p></div>`;
V.trades.after = async () => {
  const t = await loadTrades();
  const el = document.getElementById('tradelist');
  if(!el) return;
  el.innerHTML = t.length ? t.map(x=>`<div class="tick" style="padding:26px 0">
      <div class="when">${x.season} · Week ${x.wk}${x.picks?` · ${x.picks} pick${x.picks>1?'s':''}`:''}</div>
      <div class="swap" style="font-size:17px;font-weight:600">${x.teams.map(esc).join('<em>⇄</em>')}</div>
    </div>`).join('') : `<p class="empty">No completed trades on record.</p>`;
};

V.picks = () => `<div class="kicker">Draft capital</div>
  <h1 class="page">Draft pick ledger</h1>
  <p class="lede">Picks that have changed hands. Anything not listed is still with the team that earned it.</p>
  <div id="picklist" style="margin-top:44px"><p class="empty">Loading…</p></div>`;
V.picks.after = async () => {
  const el = document.getElementById('picklist');
  let tp;
  try{ tp = await get(`${API}/league/${DB.now.league.league_id}/traded_picks`); }
  catch{ el.innerHTML = `<p class="empty">Could not load traded picks.</p>`; return; }
  const own = {};
  DB.now.rosters.forEach(r => own[r.roster_id] = DB.now.teamOf[r.owner_id] || `Roster ${r.roster_id}`);
  const ord = ['','1st','2nd','3rd','4th','5th','6th','7th','8th'];
  const fut = tp.filter(p => Number(p.season) >= Number(DB.now.league.season));
  if(!fut.length){ el.innerHTML = `<p class="empty">No future picks have been traded.</p>`; return; }
  const by = {};
  fut.forEach(p => (by[p.season] = by[p.season]||[]).push(p));
  el.innerHTML = Object.keys(by).sort().map(yr => `
    <h2 class="sec" style="margin-top:52px">${yr} draft</h2>
    <table class="data"><thead><tr><th>Round</th><th>From</th><th>Now held by</th></tr></thead>
    <tbody>${by[yr].sort((a,b)=>a.round-b.round).map(p=>`<tr>
      <td class="mono">${ord[p.round]||p.round+'th'}</td>
      <td class="dim">${esc(own[p.roster_id]||'—')}</td>
      <td class="team">${esc(own[p.owner_id]||'—')}</td></tr>`).join('')}</tbody></table>`).join('');
};

V.debug = () => {
  const rows = DB.seasons.map(s => {
    const played = s.rosters.filter(r => {
      const st = r.settings||{};
      return (st.wins||0)+(st.losses||0)+(st.ties||0) > 0;
    });
    const c = champOf(s);
    return `<tr>
      <td class="mono">${s.league.season}</td>
      <td class="mono dim" style="font-size:11px">${s.league.league_id}</td>
      <td class="n mono">${s.rosters.length}</td>
      <td class="n mono">${played.length}</td>
      <td>${c ? esc(c.name) : '<span class="dim">none</span>'}</td></tr>`;
  }).join('');

  // Any manager name appearing under more than one account = a split record.
  const byName = {};
  DB.seasons.forEach(s => s.rosters.forEach(r => {
    if(!r.owner_id) return;
    const n = s.teamOf[r.owner_id] || '(unnamed)';
    (byName[n] = byName[n] || new Set()).add(r.owner_id);
  }));
  const split = Object.keys(byName).filter(n => byName[n].size > 1);

  const at = allTime();
  const gone = [];
  const activeSet = new Set(DB.now.rosters.filter(r=>r.owner_id).map(r=>ownerKey(r.owner_id)));
  DB.seasons.forEach(s => s.rosters.forEach(r => {
    if(!r.owner_id) return;
    const k = ownerKey(r.owner_id);
    if(!activeSet.has(k) && !gone.some(g => g.k === k))
      gone.push({k, name: s.teamOf[r.owner_id] || '(unnamed)', season: s.league.season});
  }));

  return `<h1 class="page">Diagnostics</h1>
  <p class="lede">What actually loaded from Sleeper. Send me this page's contents and I can
  pinpoint any record that looks wrong.</p>

  <h2 class="sec" style="margin-top:52px">Seasons in the chain</h2>
  <table class="data"><thead><tr><th>Season</th><th>League ID</th>
    <th class="n">Rosters</th><th class="n">With results</th><th>Champion</th></tr></thead>
    <tbody>${rows}</tbody></table>

  <h2 class="sec" style="margin-top:64px">Per-manager season audit</h2>
  <table class="data"><thead><tr><th>Manager</th><th>Seasons played</th>
    <th class="n">Record</th><th class="n">Games</th></tr></thead>
    <tbody>${at.map(a => {
      const yrs = DB.seasons.filter(s => {
        const r = s.rosters.find(x => x.owner_id === a.owner);
        if(!r) return false;
        const st = r.settings||{};
        return (st.wins||0)+(st.losses||0)+(st.ties||0) > 0;
      }).map(s => s.league.season);
      return `<tr><td class="team">${esc(a.name)}</td>
        <td class="dim">${yrs.join(', ') || '—'}</td>
        <td class="n rec">${a.w}-${a.l}${a.t?'-'+a.t:''}</td>
        <td class="n mono">${a.w+a.l+a.t}</td></tr>`;
    }).join('')}</tbody></table>

  <h2 class="sec" style="margin-top:64px">Former managers</h2>
  ${gone.length
    ? `<p class="lede">Hidden from the record book because they're no longer in the league:
       ${gone.map(g => esc(g.name)).join(', ')}.</p>`
    : `<p class="empty">Everyone who has played is still in the league.</p>`}

  <h2 class="sec" style="margin-top:64px">Split records</h2>
  ${split.length
    ? `<p class="lede" style="color:var(--flag)">These names appear under more than one Sleeper
       account, so their history is being split: ${split.map(esc).join(', ')}.</p>`
    : `<p class="empty">None found. Every manager maps to a single account.</p>`}`;
};

V.articles = () => {
  const ps = posts();
  return `
  <h1 class="page">Writing</h1>
  <p class="lede">Rankings, recaps, and complaints.</p>
  <div class="stack" style="margin-top:44px">${ps.length ? ps.map(p=>`
    <a class="row" href="/article/${p.slug}" data-link>
      <div class="byline" style="margin:0 0 10px">${esc(p.date)}${p.tag?' · '+esc(p.tag):''}</div>
      <h4>${esc(p.title)}</h4>
      <p>${esc(teaser(p.body).slice(0,180))}…</p></a>`).join('')
    : `<p class="empty">Nothing posted yet.</p>`}</div>`;
};

V.article = s => {
  const p = posts().find(x => x.slug === s);
  if(!p) return `<h1 class="page">Not found</h1>
    <p class="lede">No article at that address.
    <a href="/articles" data-link style="color:var(--pine)">See all writing</a>.</p>`;
  return `<div class="post">
    <a class="back" href="/articles" data-link>← Writing</a>
    <h1>${esc(p.title)}</h1>
    <div class="meta">${esc(p.date)}${p.tag?' · '+esc(p.tag):''}</div>
    <div class="body">${paras(p.body)}</div></div>`;
};

/* ==========================================================
   ROUTER
   ========================================================== */
function route(){
  const path = location.pathname.replace(/\/+$/,'') || '/';
  const seg = path.split('/').filter(Boolean);
  let name = seg[0] || 'home';
  const arg = seg[1];
  if(!V[name]) name = 'home';
  $('#view').innerHTML = V[name](arg);
  const group = name === 'article' ? 'articles' : name === 'team' ? 'teams' : name;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === group));
  const t = {home:DB.now.league.name, standings:'Standings', teams:'Teams', history:'Record book',
    trades:'Trade log', picks:'Draft picks', articles:'Writing', article:'Writing', team:'Team'};
  document.title = `${t[name]||''} · ${DB.now.league.name}`;
  window.scrollTo(0,0);
  if(V[name].after) V[name].after(arg);
}

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]');
  if(!a) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  if(location.pathname !== href){ history.pushState(null,'',href); route(); }
});
window.addEventListener('popstate', route);

(async () => {
  try{ await loadLeague(); }
  catch(e){
    $('#view').innerHTML = `<div class="msg err">Could not reach Sleeper.
      Check the LEAGUE_ID at the top of index.html.</div>`;
    return;
  }
  const n = DB.now.league;
  $('#brand').textContent = n.name;
  $('#mastsub').textContent = `Dynasty since ${DB.chain[0].season} · ${n.total_rosters} teams`;
  $('#statebar').textContent = n.name;
  $('#clock').textContent = DB.state
    ? (DB.state.week > 0 ? `${DB.state.season} · Week ${DB.state.week}`
       : `${DB.state.season} ${DB.state.season_type === 'pre' ? 'preseason' : DB.state.season_type}`)
    : '';
  $('#foot').textContent =
    `${n.name} · ${DB.seasons.length} season${DB.seasons.length>1?'s':''} · Data from the Sleeper API`;
  route();
})();
</script>
</body>
</html>
